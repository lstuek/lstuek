name: Probe contribution counts

# Task 0 (#2): can the built-in token read private contribution counts? Deleted after the run.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the calendar with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='{user(login:"lstuek"){contributionsCollection{restrictedContributionsCount contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' \
            --jq '.data.user.contributionsCollection | "total=\(.contributionCalendar.totalContributions) restricted=\(.restrictedContributionsCount)", (.contributionCalendar.weeks | map(.contributionDays[]) | .[-31:][] | "\(.date) \(.contributionCount)")'
